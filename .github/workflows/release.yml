name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Error: Release tags must be created on the main branch"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm run test:logger
          npm run test:midi-cc
          npm run test:jog

      - name: Build
        run: npm run build

      - name: Package
        run: |
          test -f dist/bfw/platformmplussd/bfw_platformmplussd.js
          test -f dist/bfw/platformmplussd/midi-cc-config.js
          (cd dist && zip -r "../bfw-platformmplussd-${GITHUB_REF_NAME}.zip" bfw)

      - name: Select release notes
        id: notes
        run: |
          if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then
            echo "path=release-notes/${GITHUB_REF_NAME}.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bfw-platformmplussd-${{ github.ref_name }}.zip
            dist/bfw/platformmplussd/bfw_platformmplussd.js
            dist/bfw/platformmplussd/midi-cc-config.js
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
