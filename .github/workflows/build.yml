name: Build Verification

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/bfw/platformmplussd/bfw_platformmplussd.js" ]; then
            echo "Error: Build output file not found"
            exit 1
          fi
          echo "Build successful - output file generated"
